apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-tomcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-tomcat
  template:
    metadata:
      labels:
        app: legacy-tomcat
    spec:
      containers:
        - name: legacy-tomcat
          image: localhost/java-wildfly-spring-otel_legacy-tomcat:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Tomcat's catalina.sh appends JAVA_OPTS to its own defaults
            - name: JAVA_OPTS
              value: -javaagent:/otel/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: legacy-tomcat
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: otlp-endpoint
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: otlp-headers
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=orders,deployment.environment=demo-k8s,service.version=1.0.0,service.instance.id=$(POD_NAME)
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS
              value: x-customer-id,x-user-id,authorization
            # Enables JAX-RS resource-method spans, where handled exceptions are recorded
            - name: OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-tomcat
spec:
  selector:
    app: legacy-tomcat
  ports:
    - port: 8080
      targetPort: 8080
