apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-wildfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-wildfly
  template:
    metadata:
      labels:
        app: legacy-wildfly
    spec:
      containers:
        - name: legacy-wildfly
          # Built locally by compose; imported into k3s by k8s/import-images.sh
          image: localhost/java-wildfly-spring-otel_legacy-wildfly:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Setting JAVA_OPTS replaces WildFly's defaults, so basic JVM settings are included here.
            # Remove the -javaagent flag to see this service as UNINSTRUMENTED.
            - name: JAVA_OPTS
              value: -Xms128m -Xmx512m -Djava.net.preferIPv4Stack=true -javaagent:/otel/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: legacy-wildfly
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: otlp-endpoint
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: otlp-headers
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=orders,deployment.environment=demo-k8s,service.version=1.0.0,service.instance.id=$(POD_NAME)
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            # "Request attributes": capture these headers onto server spans
            - name: OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS
              value: x-customer-id,x-user-id,authorization
            - name: DB_URL
              value: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
            - name: DB_USER
              value: orders
            - name: DB_PASSWORD
              value: ordersdemo1
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-wildfly
spec:
  selector:
    app: legacy-wildfly
  ports:
    - port: 8080
      targetPort: 8080
