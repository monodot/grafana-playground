apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oracle-db
  template:
    metadata:
      labels:
        app: oracle-db
    spec:
      containers:
        - name: oracle-db
          image: container-registry.oracle.com/database/free:latest-lite
          env:
            - name: ORACLE_PWD
              value: DemoAdminPw1
          ports:
            - containerPort: 1521
          volumeMounts:
            - name: oradata
              mountPath: /opt/oracle/oradata
          readinessProbe:
            exec:
              command: ["/opt/oracle/checkDBStatus.sh"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 5Gi
      volumes:
        - name: oradata
          persistentVolumeClaim:
            claimName: oracle-data
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-db
spec:
  selector:
    app: oracle-db
  ports:
    - port: 1521
      targetPort: 1521
