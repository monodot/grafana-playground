apiVersion: v1
kind: ConfigMap
metadata:
  name: shopfront-gateway-envoy
  labels:
    app.kubernetes.io/name: shopfront-gateway
    app.kubernetes.io/part-of: obi-network-metrics-demo
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: shopfront_gateway
                    route_config:
                      name: catalog_routes
                      virtual_hosts:
                        - name: catalog
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: catalog
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: catalog
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: catalog
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: catalog.obi-network-metrics.svc.cluster.local
                          port_value: 8080
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront-gateway
  labels:
    app.kubernetes.io/name: shopfront-gateway
    app.kubernetes.io/part-of: obi-network-metrics-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopfront-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopfront-gateway
        app.kubernetes.io/part-of: obi-network-metrics-demo
    spec:
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.38.0
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /server_info
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: shopfront-gateway-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: shopfront-gateway
  labels:
    app.kubernetes.io/name: shopfront-gateway
    app.kubernetes.io/part-of: obi-network-metrics-demo
spec:
  selector:
    app.kubernetes.io/name: shopfront-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
